version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pcdp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: jaison_db_password
      MYSQL_DATABASE: hackathon_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pjaison_db_password --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pcdp-backend
    restart: always
    environment:
      PORT: 8080
      JWT_SECRET: supersecretkey
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: jaison_db_password
      DB_NAME: hackathon_db
      DB_TLS: "false"
    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: pcdp-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend


  caddy:
    image: caddy:latest
    container_name: pcdp-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend


volumes:
  mysql_data:
  caddy_data:
  caddy_config: